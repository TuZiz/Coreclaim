# Help text
help-player:
  - '&#55FFAA&lClaim Commands'
  - '&#FACC15/claim &#CBD5E1View player help'
  - '&#FACC15/claim info &#CBD5E1View details for the claim under your feet'
  - '&#FACC15/claim list &#CBD5E1View claims you own or can access'
  - '&#FACC15/claim menu &#CBD5E1Open the claim menu'
  - '&#FACC15/claim set &#CBD5E1Open current claim permission settings'
  - '&#FACC15/claim create <claim name> &#CBD5E1Use a normal golden hoe: left-click point 1, right-click point 2, then create'
  - '&#FACC15/claim tp <claim name> &#CBD5E1Teleport to a claim you can enter'
  - '&#FACC15/claim tpset &#CBD5E1Set the current position as this claim teleport point'
  - '&#FACC15/claim add <player> &#CBD5E1Add a member while standing inside the current claim'
  - '&#FACC15/claim unadd <player> &#CBD5E1Remove a member and clear legacy global trust'
  - '&#FACC15/claim remove <claim name> &#CBD5E1Delete a claim you own'
  - '&#FACC15/claim deny <player|*|all> &#CBD5E1set access gate'
  - '&#FACC15/claim undeny <player|*|all> &#CBD5E1remove access gate'
  - '&#94A3B8First claim: stay online for &#F8FAFC{starter_minutes} &#94A3B8minutes to receive a starter core, or create directly with a normal golden hoe selection.'
help-admin:
  - '&#55FFAA&lAdmin'
  - '&#FACC15/claim admin create system <claim name> &#CBD5E1Create a system claim from the current selection'
  - '&#FACC15/claim admin info <claim name|#claimId> &#CBD5E1View claim details'
  - '&#FACC15/claim admin playerclaims <player> &#CBD5E1View all claims owned by a player'
  - '&#FACC15/claim admin diagnose <claim name|#claimId> [--player player] &#CBD5E1View cross-server, TP, and permission source diagnostics'
  - '&#FACC15/claim admin add <player> &#CBD5E1Force-add a member'
  - '&#FACC15/claim admin remove [claim name|#claimId] &#CBD5E1Delete the current or specified claim'
  - '&#FACC15/claim admin unadd <player> &#CBD5E1Force-remove a member and clear legacy global trust'
  - '&#FACC15/claim admin deny <player|*|all> &#CBD5E1Force-update access gate'
  - '&#FACC15/claim admin undeny <player|*|all> &#CBD5E1Remove access gate'
  - '&#FACC15/claim admin permission <permission> <allow|deny|unset> &#CBD5E1Force-update permission'
  - '&#FACC15/claim admin setserver <claimId> <serverId> &#CBD5E1Repair cross-server server_id for old claims'
  - '&#FACC15/claim activity <get|set|add|take> <player> [value] &#CBD5E1Manage activity value'
  - '&#FACC15/claim reload &#CBD5E1Reload configuration and cache'
  - '&#FACC15/claim givecore <player> [amount] &#CBD5E1Manually grant claim cores'

