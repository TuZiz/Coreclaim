# 固定可创建领地的世界
world: "world"

# 当前子服编号；单服可保持 local，多服/MySQL 共享时每个子服必须唯一
server-id: "local"

# 留空表示允许所有世界创建领地；填写后只允许列表中的世界
claim-worlds: []

# 语言文件：zh_cn / en_us
language: "zh_cn"

# 玩家在线多少分钟后获得首个领地核心
starter-reward-minutes: 30

# 指令 / GUI 每次向单个方向扩建的固定格数
direction-expand-amount: 10

# 扩建计费模型。实际保护范围不受这里影响，只改变扩建费用计算。
claim-expansion-pricing:
  # 老数据库没有创建来源字段时，是否把 fullHeight=true 的旧领地按核心领地优惠计费
  legacy-full-height-claims-as-core: true
  core-full-height:
    enabled: true
    # 核心领地实际仍然全高度保护，但水平扩建计费最多按这个高度算
    effective-height-cap: 96
    # 高度折扣，避免全高度保护扩建费用过高
    height-price-factor: 0.35
    # 核心创建领地专属折扣
    full-height-discount: 0.55
    # 最低扩建费用；0 表示不限制，且费用为 0 时不会强制最低费用
    minimum-cost: 0.0
    # 单次最高扩建费用；-1 或 0 表示不限制
    maximum-cost-per-expansion: -1.0
  selection:
    # 选区领地始终按真实新增体积计费，不套用核心领地折扣
    use-real-volume: true

# 领地核心之间的最小间隔
# 设为 0 时只禁止领地重叠，允许两个领地边界挨在一起
minimum-gap: 0

# 锄头选区创建领地之间的最小边界间隔
# 设为 0 时只禁止领地重叠，允许两个领地边界挨在一起
selection-minimum-gap: 0

# 领地名称最大长度
claim-name-max-length: 16

# 聊天输入超时秒数
chat-input-timeout-seconds: 30

# 领地转让请求超时秒数
transfer:
  request-timeout-seconds: 60

# 是否显示进入/离开领地提示
show-enter-leave-messages: true

# 创建第二块领地时是否提醒玩家确认位置
warn-on-second-claim: true

# 兼容字段：保留活跃值系统，但不再作为圈地门槛
core-use-min-activity: 0

inactive-claim-cleanup:
  # 是否启用长期未活跃领地自动清理
  enabled: false
  # 多少天无建造/交互后视为未活跃
  inactive-days: 90
  # 达到未活跃天数后再等待多少天才真正清理
  grace-days: 14
  # 后台扫描间隔，单位分钟
  scan-interval-minutes: 30
  # 不参与自动清理的权限组名
  exempt-groups: []
  # 拥有这些权限节点的玩家，其领地不参与自动清理
  exempt-permissions: []
  # 是否跳过系统领地
  ignore-system-claims: true

flight:
  # 离开可飞行领地后保留当前飞行的缓冲刻数
  exit-grace-ticks: 20
  # 飞行状态纠正间隔，单位 tick；数值越小越及时，检查也越频繁
  reconcile-interval-ticks: 10
  # 飞行权限调试日志；仅排查飞行问题时开启
  debug: false

database:
  # 兼容旧配置的数据库文件名；sqlite.sqlite.file 会优先生效
  file: coreclaim.db
  # sqlite 为单服本地文件数据库；mysql 用于多服共享 MySQL/MariaDB
  type: sqlite
  sqlite:
    file: coreclaim.db
  mysql:
    host: localhost
    port: 3306
    database: coreclaim
    username: root
    password: ""
    # MySQL TLS 模式。生产环境建议 VERIFY_IDENTITY；本地测试库可显式改为 DISABLED。
    ssl-mode: VERIFY_IDENTITY
    allow-public-key-retrieval: false
    # 旧版兼容字段；未配置 ssl-mode 时才读取
    use-ssl: false
    pool-size: 5
  migration:
    # 仅在 database.type=mysql 时使用；目标 MySQL 库必须是空库
    enabled: false
    # 从哪个旧 SQLite 文件迁移数据
    source-sqlite-file: coreclaim.db

legacy-claim-server-id-repair:
  # MySQL 多服旧数据修复开关。默认关闭，只检测并输出警告，不会自动改库。
  enabled: false
  # world-map 未命中时使用的目标 server-id；留空表示未命中的旧领地保持未修复。
  default-server-id: ""
  # 按世界修复旧 claims.server_id 为空的数据，格式：世界名: 子服 server-id。
  # enabled=true 时优先使用这里的映射，然后才使用 default-server-id。
  world-map: {}

cross-server-teleport:
  # 跨服传送开关；仅 MySQL 多服场景通常需要开启
  enabled: false
  # 跨服连接等待超时，单位秒
  pending-timeout-seconds: 30
  # 旧数据没有 server_id 时可临时配置世界到子服的映射；迁移完成后可留空
  legacy-world-server-map: {}

claim-sync:
  # MySQL 多服共享时建议开启，用于同步各子服内存中的领地缓存
  enabled: false
  # 当前仅推荐 redis
  transport: "redis"
  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    database: 0
    channel: "coreclaim:claim-sync"
    # 多服同步签名密钥；claim-sync.enabled=true 时必须填写强随机值
    message-secret: ""
    # Redis 断线后的重连间隔，单位秒
    reconnect-seconds: 5

# 领地默认规则已迁移到 rules.yml
# 旧版 config.yml 中的 permissions.* / flags.* 仍会被兼容读取，但建议迁移后删除

# 领地核心物品
# 当前项目仍沿用 claim-core 作为主配置节点，同时兼容读取 core-tool.name / core-tool.lore
claim-core:
  material: "AMETHYST_CLUSTER"
  glow: false
  custom-model-data: 1700
  name: "&d&l领地核心"
  lore:
    - ""
    - " &f▶ &7用途: &e创建新的领地"
    - ""
    - " &8▪ &7对着地面右键后开始命名"
    - " &8▪ &7聊天输入领地名字后才会真正放下核心"
    - " &8▪ &7第一块领地也可以直接使用当前核心或圈地工具创建"

starter-tool:
  material: "AMETHYST_CLUSTER"
  glow: true
  custom-model-data: 1701
  name: "&b&l✦ 新人核心 ✦"
  lore:
    - ""
    - " &b&l首块领地推荐核心"
    - " &f▶ &7用途: &e用于创建第一块默认全格保护领地"
    - " &f▶ &7来源: &b在线 %starter-reward-minutes% 分钟自动发放"
    - ""
    - " &6▶ &7仅限首块领地使用"
    - " &6▶ &7每个玩家只能成功使用一次"
    - " &6▶ &7新人核心不能被丢弃"
    - " &6▶ &7对着地面右键后开始命名"
    - " &6▶ &7输入领地名字后才会真正放下核心"
    - " &6▶ &7后续领地也可以直接用普通金锄头选区创建"

center-core:
  material: "AMETHYST_CLUSTER"
  hologram-text: "&6&l领地核心 &8(&f%claim_name%&8)"
  hologram-height: 1.8

claim-visual:
  duration-seconds: 10
  interval-ticks: 10
  size: 1.2
  pillar-height: 12
  pillar-step: 0.6
  line-step: 3.0
  color:
    red: 80
    green: 255
    blue: 140

allow-interact: []

protection:
  # 领地保护调试日志；只在排查蛋糕、斧头去皮、右键交互等问题时开启
  debug: false
  # 高频环境保护开关；默认开启以保持旧行为，关闭后对应事件会直接跳过跨领地检查
  hopper-cross-claim-check: true
  liquid-flow-cross-claim-check: true
  piston-cross-claim-check: true
  inventory-pickup-cross-claim-check: true
  # 是否允许末影珍珠进入无权限领地
  allow-ender-pearl-entry: false
  # 是否允许紫颂果传送进入无权限领地
  allow-chorus-fruit-entry: false
  # 是否允许传送门进入无权限领地
  allow-portal-entry: false
  # 是否允许钓鱼钩跨领地交互
  allow-fishing-hook-interact: false
  # 是否允许船、矿车等载具跨越领地边界
  allow-vehicle-cross-border: false
  # 是否保护床、重生锚等在特殊维度可能爆炸的方块交互
  block-special-explosive-use: true
  # 是否把按钮、拉杆、音符盒等红石类右键交互按红石权限处理
  strict-redstone-interact: true
  # 即使 allow-interact 放行，也始终按领地权限保护的方块
  always-protected-interact:
    - "BELL"
    - "LEVER"
    - "LECTERN"
    - "NOTE_BLOCK"
    - "RESPAWN_ANCHOR"

# 组别相关的初始大小 / 最大扩建 / 单价 / 数量上限请到 groups.yml 配置
# =========================================================
# 💡 提示: 组别相关的 初始大小/最大扩建/单价/数量上限 
# 请前往 groups.yml 中进行详细配置
# =========================================================
